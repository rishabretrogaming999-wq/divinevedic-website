<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>अनुभव</title>

<style>

body{
    margin:0;
    padding:0;
    font-family: Arial, sans-serif;
    background: url('11.png') no-repeat center center fixed;
    background-size: cover;
}

.experience-section{
    padding:60px 20px;
    text-align:center;
}

.experience-box{
    max-width:800px;
    margin:auto;
    background: rgba(255,255,255,0.9);
    padding:40px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
    margin-top: 100px;
}

.experience-box h1{
    font-size:40px;
    color:#8e44ad;
    margin-bottom:20px;
}

.experience-box p{
    font-size:20px;
    line-height:1.8;
    color:#444;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:12px 30px;
    background:#8e44ad;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-size:18px;
}

.btn:hover{
    background:#6c3483;
}

</style>

</head>
<body>

<section class="experience-section">

    <div class="experience-box">

        <h1>🕉 अनुभव</h1>

        <p>
            हमें वैदिक पूजा, कथा, जगरण एवं धार्मिक अनुष्ठानों का वर्षों का अनुभव है।  
            श्रद्धा, विश्वास और सही विधि के साथ हर कार्य सम्पन्न किया जाता है।
        </p>

        <p>
            अनेक सफल अनुष्ठानों एवं संतुष्ट लोगों के विश्वास ने हमारी सेवाओं को और मजबूत बनाया है।
        </p>

        <a href="index.html" class="btn">होम पेज</a>

    </div>

</section>

</body>
</html>
