<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>प्रामाणिक ज्ञान</title>

<style>

body{
    margin:0;
    padding:0;
    font-family: Arial, sans-serif;
    background:url('image/11.png') no-repeat center center fixed;
    background-size:cover;
}

.knowledge-section{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    box-sizing:border-box;
}

.knowledge-box{
    max-width:800px;
    background:rgba(255,255,255,0.9);
    padding:40px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

.knowledge-box h1{
    font-size:42px;
    color:#c0392b;
    margin-bottom:20px;
}

.knowledge-box p{
    font-size:20px;
    line-height:1.8;
    color:#444;
}

.btn{
    display:inline-block;
    margin-top:25px;
    padding:12px 30px;
    background:#c0392b;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-size:18px;
    transition:0.3s;
}

.btn:hover{
    background:#922b21;
}

</style>

</head>
<body>

<section class="knowledge-section">

    <div class="knowledge-box">

        <h1>🔱 प्रामाणिक ज्ञान</h1>

        <p>
            हम शास्त्रों एवं वैदिक ज्ञान के अनुसार सही मार्गदर्शन प्रदान करते हैं।
            वर्षों के अनुभव और आध्यात्मिक साधना के माध्यम से लोगों की समस्याओं का समाधान किया जाता है।
        </p>

        <p>
            कुंडली, पूजा, कथा, जगरण एवं धार्मिक अनुष्ठानों में पूर्ण वैदिक विधि का पालन किया जाता है।
        </p>

        <a href="index.html" class="btn">होम पेज</a>

    </div>

</section>

</body>
</html>
